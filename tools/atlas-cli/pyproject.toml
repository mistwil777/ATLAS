[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-cli"
version = "1.0.0"
description = "ATLAS — single entry point CLI. Install once, run any CDC."
requires-python = ">=3.10"
dependencies = [
    "atlas-core",
    "atlas-memory",
    "atlas-bus",
    "atlas-judge",
    "atlas-orchestrator",
    "cdc-router",
    "agent-forge",
    "pair-forge",
    "atlas-dashboard",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
atlas = "atlas_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_cli*"]
