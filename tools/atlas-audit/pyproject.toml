[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-audit"
version = "1.0.0"
description = "ATLAS HITL audit CLI — list, inspect, and review pipeline runs."
requires-python = ">=3.10"
dependencies = [
    "atlas-memory",
]

[project.scripts]
atlas-audit = "atlas_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_audit*"]
