<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS Dashboard</title>
  <style>
    :root {
      --bg: #0e0e14;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --blue: #3987e5;
      --aqua: #1baf7a;
      --red: #e66767;
      --yellow: #e8a600;
      --violet: #9085e9;
      --ink: #c8c0d8;
      --ink-dim: #7a748a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }

    header { padding: 14px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 16px; color: var(--blue); letter-spacing: 0.08em; }
    header .tag { font-size: 11px; color: var(--ink-dim); background: var(--surface); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }

    /* ── KPI bar ── */
    .kpi-bar { display: flex; gap: 12px; padding: 14px 32px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 18px; min-width: 120px; }
    .kpi .kpi-label { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .kpi .kpi-value { font-size: 20px; font-weight: bold; }
    .kpi.blue  .kpi-value { color: var(--blue); }
    .kpi.aqua  .kpi-value { color: var(--aqua); }
    .kpi.red   .kpi-value { color: var(--red); }
    .kpi.yellow .kpi-value { color: var(--yellow); }
    .kpi.violet .kpi-value { color: var(--violet); }

    /* ── Agent table ── */
    .agent-table-wrap { padding: 10px 32px 0; border-bottom: 1px solid var(--border); }
    .agent-table-wrap summary { font-size: 11px; color: var(--ink-dim); cursor: pointer; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    th { text-align: left; color: var(--ink-dim); padding: 4px 8px; border-bottom: 1px solid var(--border); font-weight: normal; text-transform: uppercase; letter-spacing: .05em; }
    td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .rate-bar { display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle; margin-left: 6px; }

    /* ── Toolbar ── */
    .toolbar { padding: 10px 32px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
    .toolbar button { padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 12px; transition: border-color .15s; }
    .toolbar button:hover { border-color: var(--blue); color: var(--blue); }
    .toolbar button.active { border-color: var(--blue); color: var(--blue); }

    /* ── Layout ── */
    .layout { display: flex; height: calc(100vh - 210px); }
    .run-list { width: 400px; border-right: 1px solid var(--border); overflow-y: auto; }
    .run-item { padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
    .run-item:hover { background: var(--surface); }
    .run-item.selected { background: var(--surface); border-left: 2px solid var(--blue); }
    .run-item .run-id { font-size: 11px; color: var(--ink-dim); margin-bottom: 4px; }
    .run-item .run-meta { display: flex; gap: 8px; align-items: center; }

    .badge { font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: bold; }
    .badge-pending  { background: #2a2a14; color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-approved { background: #0d2a1a; color: var(--aqua);   border: 1px solid var(--aqua); }
    .badge-rejected { background: #2a0d0d; color: var(--red);    border: 1px solid var(--red); }
    .badge-review   { background: #1a1220; color: var(--violet); border: 1px solid var(--violet); }
    .badge-success  { background: #0d2a1a; color: var(--aqua);   border: 1px solid var(--aqua); }
    .badge-failed   { background: #2a0d0d; color: var(--red);    border: 1px solid var(--red); }
    .badge-skipped  { background: #1a1a1a; color: var(--ink-dim); border: 1px solid var(--border); }

    .detail { flex: 1; overflow-y: auto; padding: 22px 32px; }
    .detail-empty { color: var(--ink-dim); margin-top: 40px; text-align: center; }
    .detail h2 { font-size: 14px; color: var(--blue); margin-bottom: 14px; }
    .actions { display: flex; gap: 10px; margin-bottom: 18px; }
    .btn-approve { padding: 7px 18px; background: var(--aqua); color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-reject  { padding: 7px 18px; background: var(--red);  color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-approve:disabled, .btn-reject:disabled { opacity: .4; cursor: default; }
    .bloc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .bloc-card .bloc-header { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .bloc-card .bloc-agent { color: var(--blue); font-size: 12px; }
    .bloc-card .bloc-score { font-size: 11px; color: var(--ink-dim); }
    .bloc-card .bloc-preview { font-size: 11px; color: var(--ink-dim); white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; }
    .meta-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

    /* ── Agents to Create panel ── */
    .create-panel { margin-top: 22px; }
    .create-panel h3 { font-size: 12px; color: var(--violet); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .agent-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; flex-direction: column; }
    .agent-row-header { display: flex; align-items: center; gap: 10px; width: 100%; }
    .agent-row-name { color: var(--violet); font-size: 13px; flex: 1; }
    .btn-scaffold { padding: 5px 14px; background: transparent; border: 1px solid var(--violet); color: var(--violet); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-scaffold:hover { background: var(--violet); color: #000; }
    .btn-scaffold:disabled { opacity: .4; cursor: default; }
    .btn-install { padding: 5px 14px; background: transparent; border: 1px solid var(--aqua); color: var(--aqua); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-install:hover { background: var(--aqua); color: #000; }
    .btn-download { padding: 5px 14px; background: transparent; border: 1px solid var(--blue); color: var(--blue); border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
    .btn-download:hover { background: var(--blue); color: #fff; }
    .btn-rerun { padding: 7px 18px; background: var(--blue); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-top: 12px; }
    .btn-rerun:hover { opacity: .85; }
    .code-viewer { margin-top: 8px; width: 100%; }
    .code-viewer select { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 4px; padding: 4px; font-size: 11px; margin-bottom: 6px; }
    .code-viewer pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--violet); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>ATLAS Dashboard</h1>
  <span class="tag">HITL Review</span>
  <a href="/logout" style="margin-left:auto;font-size:11px;color:var(--ink-dim);text-decoration:none;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--ink-dim)'">Sign out</a>
</header>

<div class="kpi-bar" id="kpi-bar">
  <div class="kpi blue"><div class="kpi-label">Total runs</div><div class="kpi-value" id="kpi-total">—</div></div>
  <div class="kpi yellow"><div class="kpi-label">Pending</div><div class="kpi-value" id="kpi-pending">—</div></div>
  <div class="kpi aqua"><div class="kpi-label">Approved</div><div class="kpi-value" id="kpi-approved">—</div></div>
  <div class="kpi red"><div class="kpi-label">Rejected</div><div class="kpi-value" id="kpi-rejected">—</div></div>
  <div class="kpi violet"><div class="kpi-label">Review rate</div><div class="kpi-value" id="kpi-review-rate">—</div></div>
  <div class="kpi aqua"><div class="kpi-label">Judge pass rate</div><div class="kpi-value" id="kpi-judge-rate">—</div></div>
</div>

<details class="agent-table-wrap" id="agent-table-wrap">
  <summary>Judge pass rate by agent ▸</summary>
  <table id="agent-table">
    <thead><tr><th>Agent</th><th>Blocs</th><th>Pass rate</th><th>Avg score</th></tr></thead>
    <tbody id="agent-tbody"></tbody>
  </table>
</details>

<div class="toolbar">
  <button id="btn-all" class="active" onclick="loadRuns(false)">All runs</button>
  <button id="btn-review" onclick="loadRuns(true)">Needs review</button>
  <button onclick="refresh()">Refresh</button>
</div>

<div class="layout">
  <div class="run-list" id="run-list">
    <div style="padding:20px; color: var(--ink-dim);">Loading…</div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-empty">Select a run to inspect it.</div>
  </div>
</div>

<script>
  let currentFilter = false;
  let selectedId = null;

  function pct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
  function score(v) { return v != null ? v.toFixed(2) : '—'; }

  function rateColor(v) {
    if (v == null) return 'var(--ink-dim)';
    if (v >= 0.8) return 'var(--aqua)';
    if (v >= 0.5) return 'var(--yellow)';
    return 'var(--red)';
  }

  async function loadStats() {
    const s = await fetch('/api/stats').then(r => r.json());
    document.getElementById('kpi-total').textContent = s.total_runs;
    document.getElementById('kpi-pending').textContent = s.pending;
    document.getElementById('kpi-approved').textContent = s.approved;
    document.getElementById('kpi-rejected').textContent = s.rejected;
    document.getElementById('kpi-review-rate').textContent = pct(s.review_rate);
    document.getElementById('kpi-judge-rate').textContent = pct(s.judge_pass_rate);

    const tbody = document.getElementById('agent-tbody');
    const agents = Object.entries(s.by_agent || {});
    if (!agents.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:var(--ink-dim)">No agent data yet.</td></tr>';
      return;
    }
    tbody.innerHTML = agents.map(([agent, d]) => {
      const rate = d.judge_pass_rate;
      const barW = rate != null ? Math.round(rate * 80) : 0;
      const col = rateColor(rate);
      return `<tr>
        <td style="color:var(--blue)">${agent}</td>
        <td>${d.total_blocs}</td>
        <td>
          <span style="color:${col}">${pct(rate)}</span>
          <span class="rate-bar" style="width:${barW}px;background:${col}"></span>
        </td>
        <td style="color:var(--ink-dim)">${score(d.avg_score)}</td>
      </tr>`;
    }).join('');
  }

  async function loadRuns(reviewOnly) {
    currentFilter = reviewOnly;
    document.getElementById('btn-all').classList.toggle('active', !reviewOnly);
    document.getElementById('btn-review').classList.toggle('active', reviewOnly);
    const url = reviewOnly ? '/api/runs?review=true' : '/api/runs';
    const runs = await fetch(url).then(r => r.json());
    runs.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    const list = document.getElementById('run-list');
    if (!runs.length) {
      list.innerHTML = '<div style="padding:20px;color:var(--ink-dim)">No runs.</div>';
      return;
    }
    list.innerHTML = runs.map(r => `
      <div class="run-item${r.run_id === selectedId ? ' selected' : ''}" onclick="showRun('${r.run_id}')">
        <div class="run-id">${r.run_id}</div>
        <div class="run-meta">
          <span class="badge badge-${r.status}">${r.status}</span>
          ${r.requires_review ? '<span class="badge badge-review">review</span>' : ''}
          <span style="font-size:11px;color:var(--ink-dim)">${r.created_at.slice(0,19).replace('T',' ')}</span>
        </div>
      </div>`).join('');
  }

  async function showRun(runId) {
    selectedId = runId;
    document.querySelectorAll('.run-item').forEach(el => {
      el.classList.toggle('selected', el.querySelector('.run-id').textContent === runId);
    });
    const run = await fetch(`/api/runs/${runId}`).then(r => r.json());
    const isPending = run.status === 'pending';
    document.getElementById('detail').innerHTML = `
      <h2>Run ${run.run_id}</h2>
      <div class="meta-row">
        <span class="badge badge-${run.status}">${run.status}</span>
        ${run.requires_review ? '<span class="badge badge-review">requires review</span>' : ''}
        <span style="color:var(--ink-dim);font-size:11px">${run.created_at}</span>
      </div>
      <div class="actions">
        <button class="btn-approve" ${isPending ? '' : 'disabled'} onclick="decide('${runId}','approve')">Approve</button>
        <button class="btn-reject"  ${isPending ? '' : 'disabled'} onclick="decide('${runId}','reject')">Reject</button>
        <button class="btn-reject" style="margin-left:auto;background:transparent;border:1px solid var(--red);color:var(--red)" onclick="deleteRun('${runId}')">Delete</button>
      </div>
      ${(run.blocs || []).map(b => `
        <div class="bloc-card">
          <div class="bloc-header">
            <span class="bloc-agent">${b.agent || '—'}</span>
            <span class="badge badge-${b.status || 'skipped'}">${b.status || 'skipped'}</span>
            ${b.requires_review ? '<span class="badge badge-review">review</span>' : ''}
            <span class="bloc-score">${b.judge_score != null ? 'score: ' + b.judge_score.toFixed(2) : ''}</span>
          </div>
          <div class="bloc-preview">${(b.output_preview || b.bloc || '').slice(0, 400)}</div>
        </div>`).join('')}
      ${buildCreatePanel(run)}
    `;
  }

  // ── Agents to Create ─────────────────────────────────────────────────────────

  const _scaffoldState = {}; // runId+agentName → {state, files, outputPath}

  function _stateKey(runId, agent) { return `${runId}::${agent}`; }

  function buildCreatePanel(run) {
    const agents = run.requires_creation || [];
    if (!agents.length) return '';
    const scaffolded = run.scaffolded || {};
    const allInstalled = agents.every(a => scaffolded[a]?.installed);

    const rows = agents.map(agent => {
      const sc = scaffolded[agent];
      const key = _stateKey(run.run_id, agent);
      const state = _scaffoldState[key]?.state || (sc?.installed ? 'installed' : sc ? 'scaffolded' : 'pending');

      let controls = '';
      if (state === 'pending') {
        controls = `<button class="btn-scaffold" onclick="scaffold('${run.run_id}','${agent}')">Scaffold</button>`;
      } else if (state === 'scaffolding') {
        controls = `<span class="spinner"></span> <span style="color:var(--ink-dim);font-size:11px">Scaffolding…</span>`;
      } else if (state === 'scaffolded') {
        const files = _scaffoldState[key]?.files || {};
        const fileNames = Object.keys(files);
        const selectOpts = fileNames.map(f => `<option value="${f}">${f}</option>`).join('');
        const firstContent = fileNames.length ? escHtml(files[fileNames[0]]) : '';
        controls = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <button class="btn-install" onclick="installAgent('${run.run_id}','${agent}')">Install &amp; Register</button>
            <a class="btn-download" href="/api/runs/${run.run_id}/agents/${agent}/download" download="${agent}.zip">Download</a>
          </div>
          <div class="code-viewer" id="viewer-${agent}">
            <select onchange="switchFile('${agent}',this.value,${JSON.stringify(JSON.stringify(files))})">${selectOpts}</select>
            <pre id="code-${agent}">${firstContent}</pre>
          </div>`;
      } else if (state === 'installing') {
        controls = `<span class="spinner"></span> <span style="color:var(--ink-dim);font-size:11px">Installing…</span>`;
      } else if (state === 'installed') {
        const files = _scaffoldState[key]?.files || sc?.spec ? {} : {};
        controls = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span class="badge badge-approved">installed</span>
            <a class="btn-download" href="/api/runs/${run.run_id}/agents/${agent}/download" download="${agent}.zip">Download</a>
          </div>`;
      }
      return `
        <div class="agent-row" id="agent-row-${agent}">
          <div class="agent-row-header">
            <span class="agent-row-name">${agent}</span>
            ${controls}
          </div>
        </div>`;
    }).join('');

    const rerunBtn = allInstalled
      ? `<button class="btn-rerun" onclick="rerun('${run.run_id}')">Re-run Pipeline</button>`
      : '';

    return `<div class="create-panel"><h3>Agents to Create (${agents.length})</h3>${rows}${rerunBtn}</div>`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function switchFile(agent, fname, filesJson) {
    const files = JSON.parse(filesJson);
    document.getElementById(`code-${agent}`).textContent = files[fname] || '';
  }

  async function scaffold(runId, agentName) {
    const key = _stateKey(runId, agentName);
    _scaffoldState[key] = { state: 'scaffolding' };
    await showRun(runId);
    try {
      const res = await fetch(`/api/runs/${runId}/scaffold/${agentName}`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json();
        alert('Scaffold failed: ' + (err.detail || JSON.stringify(err)));
        _scaffoldState[key] = { state: 'pending' };
      } else {
        const data = await res.json();
        _scaffoldState[key] = { state: 'scaffolded', files: data.files, outputPath: data.output_path };
      }
    } catch(e) {
      alert('Scaffold error: ' + e.message);
      _scaffoldState[key] = { state: 'pending' };
    }
    await showRun(runId);
  }

  async function installAgent(runId, agentName) {
    const key = _stateKey(runId, agentName);
    const prev = _scaffoldState[key] || {};
    _scaffoldState[key] = { ...prev, state: 'installing' };
    await showRun(runId);
    try {
      const res = await fetch(`/api/runs/${runId}/install/${agentName}`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json();
        alert('Install failed: ' + (err.detail || JSON.stringify(err)));
        _scaffoldState[key] = { ...prev, state: 'scaffolded' };
      } else {
        _scaffoldState[key] = { ...prev, state: 'installed' };
      }
    } catch(e) {
      alert('Install error: ' + e.message);
      _scaffoldState[key] = { ...prev, state: 'scaffolded' };
    }
    await showRun(runId);
  }

  async function rerun(runId) {
    const btn = document.querySelector('.btn-rerun');
    if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
    try {
      const res = await fetch(`/api/runs/${runId}/rerun`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json();
        alert('Re-run failed: ' + (err.detail || JSON.stringify(err)));
        return;
      }
      const data = await res.json();
      await refresh();
      if (data.new_run_id) await showRun(data.new_run_id);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Re-run Pipeline'; }
    }
  }

  async function decide(runId, action) {
    await fetch(`/api/runs/${runId}/${action}`, { method: 'POST' });
    await refresh();
  }

  async function deleteRun(runId) {
    if (!confirm('Delete this run?')) return;
    await fetch(`/api/runs/${runId}`, { method: 'DELETE' });
    selectedId = null;
    document.getElementById('detail').innerHTML = '<div style="padding:20px;color:var(--ink-dim)">Select a run.</div>';
    await refresh();
  }

  async function refresh() {
    await Promise.all([loadStats(), loadRuns(currentFilter)]);
    if (selectedId) await showRun(selectedId);
  }

  refresh();
</script>
</body>
</html>
