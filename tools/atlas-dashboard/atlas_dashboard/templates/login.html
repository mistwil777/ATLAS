<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ATLAS — Login</title>
  <style>
    :root { --bg: #0e0e14; --surface: #1a1a24; --border: #2a2a3a; --blue: #3987e5; --ink: #c8c0d8; --ink-dim: #7a748a; --red: #e66767; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 40px 48px; width: 360px; }
    h1 { color: var(--blue); font-size: 18px; letter-spacing: .08em; margin-bottom: 6px; }
    .sub { color: var(--ink-dim); font-size: 12px; margin-bottom: 28px; }
    label { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 6px; }
    input[type=password] { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--ink); font-family: inherit; font-size: 13px; outline: none; }
    input[type=password]:focus { border-color: var(--blue); }
    button { margin-top: 20px; width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: .9; }
    .error { color: var(--red); font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
<div class="card">
  <h1>ATLAS Dashboard</h1>
  <p class="sub">HITL Review — authentication required</p>
  <form method="POST" action="/login">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus placeholder="Enter your token" />
    <button type="submit">Sign in</button>
  </form>
  <!--ERROR-->
</div>
</body>
</html>
