[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.10"

# ── UV workspace ──────────────────────────────────────────────────────────────
# agents/    = extractible business agents (agnostic, reusable per project)
# platform/  = ATLAS infrastructure agents (orchestrator, judge, memory, bus, tooling)
# libs/      = shared libraries (no entry-point, no LLM)
[tool.uv.workspace]
members = ["agents/*", "platform/*", "runners/*", "tools/*", "libs/*"]

[tool.uv.sources]
pair-forge    = { workspace = true }
agent-forge   = { workspace = true }
cdc-router    = { workspace = true }
atlas-core         = { workspace = true }
contract-validator = { workspace = true }
atlas-bus          = { workspace = true }
atlas-memory       = { workspace = true }
atlas-judge        = { workspace = true }
atlas-orchestrator = { workspace = true }

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["agents", "platform", "runners", "tools", "libs"]
addopts   = "-q --tb=short"
