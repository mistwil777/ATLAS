<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ATLAS — Pipeline E2E</title>
<style>
  body { background:#0d0d1a; margin:0; display:flex; justify-content:center; padding:40px 20px; }
</style>
</head>
<body>
<svg viewBox="0 0 960 1320" xmlns="http://www.w3.org/2000/svg"
     font-family="Inter, system-ui, sans-serif"
     width="960" height="1320">

<defs>
  <!-- Flèche principale grise -->
  <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#c8c0d8"/>
  </marker>
  <!-- Flèche boucle gauche jaune -->
  <marker id="ay" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#e8a600"/>
  </marker>
  <!-- Flèche boucle droite rouge -->
  <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#e66767"/>
  </marker>
</defs>

<!-- ══════════════════════════════════════════════
     FLÈCHES PRINCIPALES (flux Oui vers le bas)
     ══════════════════════════════════════════════ -->
<!-- DÉBUT → CDC -->
<line x1="390" y1="81" x2="390" y2="118" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- CDC → Générer -->
<line x1="390" y1="172" x2="390" y2="213" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- Générer → Test statique -->
<line x1="390" y1="267" x2="390" y2="303" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- Test statique → Losange score statique -->
<line x1="390" y1="357" x2="390" y2="384" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- Losange score statique Oui → Évaluer -->
<line x1="390" y1="476" x2="390" y2="533" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="510" fill="#1baf7a" font-size="11">Oui</text>
<!-- Évaluer → Losange score ≥4 -->
<line x1="390" y1="587" x2="390" y2="614" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- Losange score ≥4 Oui → Losange tous agents -->
<line x1="390" y1="706" x2="390" y2="744" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="730" fill="#1baf7a" font-size="11">Oui</text>
<!-- Losange tous agents Oui → Tests pipeline -->
<line x1="390" y1="836" x2="390" y2="893" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="870" fill="#1baf7a" font-size="11">Oui</text>
<!-- Tests pipeline → Losange pipeline OK -->
<line x1="390" y1="947" x2="390" y2="974" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<!-- Losange pipeline OK Oui → Valider -->
<line x1="390" y1="1066" x2="390" y2="1123" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="1100" fill="#1baf7a" font-size="11">Oui</text>
<!-- Valider → FIN -->
<line x1="390" y1="1177" x2="390" y2="1224" stroke="#c8c0d8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ══════════════════════════════════════════════
     BOUCLE GAUCHE 1 : Losange 5 Non → Générer
     ══════════════════════════════════════════════ -->
<path d="M295,430 L90,430 L90,240 L280,240"
      fill="none" stroke="#e8a600" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<text x="280" y="424" fill="#e8a600" font-size="11">Non</text>

<!-- ══════════════════════════════════════════════
     BOUCLE GAUCHE 2 : Losange 8 Non → Évaluer (agent suivant)
     ══════════════════════════════════════════════ -->
<path d="M295,790 L90,790 L90,560 L280,560"
      fill="none" stroke="#e8a600" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<text x="280" y="784" fill="#e8a600" font-size="11">Non</text>

<!-- ══════════════════════════════════════════════
     BOUCLE DROITE 1 : Losange 7 Non → Analyser LLM → Générer
     ══════════════════════════════════════════════ -->
<!-- Losange 7 droit → boîte Analyser LLM -->
<line x1="485" y1="660" x2="545" y2="660" stroke="#e66767" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="492" y="651" fill="#e66767" font-size="11">Non</text>
<!-- Retour boîte bas → Générer droit -->
<path d="M625,685 L625,760 L710,760 L710,240 L500,240"
      fill="none" stroke="#e66767" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>

<!-- ══════════════════════════════════════════════
     BOUCLE DROITE 2 : Losange 10 Non → Identifier fautif → Évaluer
     ══════════════════════════════════════════════ -->
<!-- Losange 10 droit → boîte Identifier fautif -->
<line x1="485" y1="1020" x2="545" y2="1020" stroke="#e66767" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="492" y="1011" fill="#e66767" font-size="11">Non</text>
<!-- Retour boîte bas → Évaluer droit -->
<path d="M625,1045 L625,1110 L725,1110 L725,560 L500,560"
      fill="none" stroke="#e66767" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>

<!-- ══════════════════════════════════════════════
     NŒUDS
     ══════════════════════════════════════════════ -->

<!-- 1. DÉBUT (ovale) cy=55 -->
<ellipse cx="390" cy="55" rx="90" ry="26" fill="#0c1520" stroke="#3987e5" stroke-width="1.5"/>
<text x="390" y="60" text-anchor="middle" fill="#c8c0d8" font-size="14" font-weight="600">DÉBUT</text>

<!-- 2. Créer / charger un CDC cy=145 -->
<rect x="280" y="118" width="220" height="54" rx="6" fill="#111122" stroke="#3987e5" stroke-width="1.5"/>
<text x="390" y="140" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Créer / charger un CDC</text>
<text x="390" y="157" text-anchor="middle" fill="#6b6880" font-size="10">Définir les agents et contrats</text>
<text x="390" y="168" text-anchor="middle" fill="#3987e5" font-size="9" letter-spacing="0.05em">PROJETS</text>

<!-- 3. Générer les agents cy=240 -->
<rect x="280" y="213" width="220" height="54" rx="6" fill="#111122" stroke="#9085e9" stroke-width="1.5"/>
<text x="390" y="235" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Générer les agents</text>
<text x="390" y="252" text-anchor="middle" fill="#6b6880" font-size="10">Code agent produit depuis le CDC</text>
<text x="390" y="263" text-anchor="middle" fill="#9085e9" font-size="9" letter-spacing="0.05em">RUNS</text>

<!-- ── Branche outils : flèche de Générer vers la note ── -->
<line x1="500" y1="240" x2="540" y2="240" stroke="#9085e9" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#ay)"/>

<!-- Note outil : fond sombre, bordure violet -->
<rect x="542" y="200" width="390" height="116" rx="6" fill="#0f0d1e" stroke="#9085e9" stroke-width="1.2" stroke-dasharray="4,2"/>
<text x="558" y="220" fill="#9085e9" font-size="10" font-weight="700" letter-spacing="0.06em">RÉSOLUTION DES OUTILS REQUIS</text>

<!-- Ligne 1 : catalogue -->
<rect x="558" y="228" width="8" height="8" rx="2" fill="#1baf7a"/>
<text x="572" y="237" fill="#c8c0d8" font-size="11">Outil déjà dans le catalogue</text>
<text x="572" y="250" fill="#6b6880" font-size="10">→ Réutiliser directement</text>

<!-- Ligne 2 : open-source -->
<rect x="558" y="260" width="8" height="8" rx="2" fill="#3987e5"/>
<text x="572" y="269" fill="#c8c0d8" font-size="11">Équivalent open-source connu</text>
<text x="572" y="282" fill="#6b6880" font-size="10">→ Recommander (ex: pandas, spaCy…)</text>

<!-- Ligne 3 : générer -->
<rect x="558" y="292" width="8" height="8" rx="2" fill="#e8a600"/>
<text x="572" y="301" fill="#c8c0d8" font-size="11">Aucun outil adapté disponible</text>
<text x="572" y="314" fill="#6b6880" font-size="10">→ Générer l'outil → stocker dans le catalogue</text>

<!-- 4. Test statique cy=330 (bordure pointillée) -->
<rect x="280" y="303" width="220" height="54" rx="6" fill="#0d0d1a" stroke="#6b6880" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="390" y="325" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Test statique</text>
<text x="390" y="342" text-anchor="middle" fill="#6b6880" font-size="10">Le juge lit le code, sans exécution</text>
<text x="390" y="353" text-anchor="middle" fill="#6b6880" font-size="9" letter-spacing="0.05em">RUNS</text>

<!-- 5. Losange : Score statique acceptable ? cy=430 -->
<polygon points="390,384 485,430 390,476 295,430"
         fill="#1a1a10" stroke="#e8a600" stroke-width="1.5"/>
<text x="390" y="425" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">Score statique</text>
<text x="390" y="440" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">acceptable ?</text>

<!-- 6. Évaluer l'agent cy=560 -->
<rect x="280" y="533" width="220" height="54" rx="6" fill="#111122" stroke="#1baf7a" stroke-width="1.5"/>
<text x="390" y="555" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Évaluer l'agent</text>
<text x="390" y="572" text-anchor="middle" fill="#6b6880" font-size="10">Input réel/généré + juge output</text>
<text x="390" y="583" text-anchor="middle" fill="#1baf7a" font-size="9" letter-spacing="0.05em">SCORES AGENTS</text>

<!-- 7. Losange : Score ≥ 4/5 ? cy=660 -->
<polygon points="390,614 485,660 390,706 295,660"
         fill="#1a1a10" stroke="#e8a600" stroke-width="1.5"/>
<text x="390" y="655" text-anchor="middle" fill="#c8c0d8" font-size="12" font-weight="600">Score ≥ 4/5 ?</text>

<!-- Boîte droite : Analyser avec LLM cy=660 -->
<rect x="545" y="635" width="165" height="50" rx="6" fill="#1a0f0f" stroke="#e66767" stroke-width="1.5"/>
<text x="627" y="656" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">Analyser avec LLM</text>
<text x="627" y="672" text-anchor="middle" fill="#6b6880" font-size="10">Identifier la cause du score</text>

<!-- 8. Losange : Tous les agents évalués ? cy=790 -->
<polygon points="390,744 485,790 390,836 295,790"
         fill="#1a1a10" stroke="#e8a600" stroke-width="1.5"/>
<text x="390" y="785" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">Tous les agents</text>
<text x="390" y="800" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">évalués ?</text>

<!-- 9. Tester le pipeline cy=920 -->
<rect x="280" y="893" width="220" height="54" rx="6" fill="#111122" stroke="#e8a600" stroke-width="1.5"/>
<text x="390" y="915" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Tester le pipeline</text>
<text x="390" y="932" text-anchor="middle" fill="#6b6880" font-size="10">Chaîne complète sur ticket réel</text>
<text x="390" y="943" text-anchor="middle" fill="#e8a600" font-size="9" letter-spacing="0.05em">TESTS</text>

<!-- 10. Losange : Pipeline OK ? cy=1020 -->
<polygon points="390,974 485,1020 390,1066 295,1020"
         fill="#1a1a10" stroke="#e8a600" stroke-width="1.5"/>
<text x="390" y="1015" text-anchor="middle" fill="#c8c0d8" font-size="12" font-weight="600">Pipeline OK ?</text>

<!-- Boîte droite : Identifier l'agent fautif cy=1020 -->
<rect x="545" y="995" width="165" height="50" rx="6" fill="#1a0f0f" stroke="#e66767" stroke-width="1.5"/>
<text x="627" y="1016" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">Identifier l'agent</text>
<text x="627" y="1032" text-anchor="middle" fill="#c8c0d8" font-size="11" font-weight="600">fautif</text>

<!-- 11. Valider et déployer cy=1150 -->
<rect x="280" y="1123" width="220" height="54" rx="6" fill="#111122" stroke="#1baf7a" stroke-width="1.5"/>
<text x="390" y="1145" text-anchor="middle" fill="#c8c0d8" font-size="13" font-weight="600">Valider et déployer</text>
<text x="390" y="1162" text-anchor="middle" fill="#6b6880" font-size="10">Pipeline prêt pour production</text>
<text x="390" y="1173" text-anchor="middle" fill="#1baf7a" font-size="9" letter-spacing="0.05em">—</text>

<!-- 12. FIN (ovale) cy=1250 -->
<ellipse cx="390" cy="1250" rx="90" ry="26" fill="#091409" stroke="#1baf7a" stroke-width="1.5"/>
<text x="390" y="1255" text-anchor="middle" fill="#c8c0d8" font-size="14" font-weight="600">FIN</text>

<!-- ══════════════════════════════════════════════
     LÉGENDE
     ══════════════════════════════════════════════ -->
<rect x="50" y="1285" width="860" height="26" rx="4" fill="#0f0f1a"/>
<line x1="65" y1="1298" x2="90" y2="1298" stroke="#c8c0d8" stroke-width="1.5"/>
<text x="96" y="1302" fill="#6b6880" font-size="10">Flux principal</text>
<line x1="200" y1="1298" x2="225" y2="1298" stroke="#e8a600" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="231" y="1302" fill="#6b6880" font-size="10">Re-générer (score insuffisant)</text>
<line x1="430" y1="1298" x2="455" y2="1298" stroke="#e66767" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="461" y="1302" fill="#6b6880" font-size="10">Re-évaluer (pipeline KO)</text>

</svg>
</body>
</html>
