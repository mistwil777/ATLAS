[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-forge"
version = "1.0.0"
description = "Autonomous agent: generates ATLAS agent scaffolding from a spec or interactive dialogue."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
validate = ["agent-tester"]

[project.scripts]
agent-forge = "agent_forge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_forge*"]

[tool.setuptools.package-data]
"agent_forge.tests.smoke.fixtures" = ["*"]
