[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-memory"
version = "1.0.0"
description = "Autonomous agent: shared RAG + Knowledge Graph memory for all ATLAS agents."
requires-python = ">=3.10"
dependencies = [
    "qdrant-client[fastembed]>=1.12,<2.0",
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
collect = ["atlas-core"]
dev = ["pytest>=8.0"]

[project.entry-points."atlas.agents"]
atlas-memory = "atlas_memory.agent:AtlasMemoryAgent"

[project.scripts]
atlas-memory = "atlas_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_memory*"]

[tool.setuptools.package-data]
"atlas_memory.tests.smoke.fixtures" = ["*"]
