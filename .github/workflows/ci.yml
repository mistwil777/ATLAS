name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ── pair-forge ────────────────────────────────────────────────────────────
  pair-forge:
    name: pair-forge / smoke + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install agents
        run: uv pip install -e libs/atlas-core/ -e agents/pair-forge/ -e platform/agent-tester/

      - name: Dependency status
        run: uv run python -m pair_forge check
        continue-on-error: true

      - name: Smoke tests (PDF / RTF / DOCX)
        run: |
          uv run pytest \
            agents/pair-forge/pair_forge/tests/smoke/test_pdf.py \
            agents/pair-forge/pair_forge/tests/smoke/test_rtf.py \
            agents/pair-forge/pair_forge/tests/smoke/test_docx.py \
            -v

      - name: Smoke tests (OCR — optional)
        run: uv run pytest agents/pair-forge/pair_forge/tests/smoke/test_ocr.py -v
        continue-on-error: true

  # ── agent-tester ──────────────────────────────────────────────────────────
  agent-tester:
    name: agent-tester / smoke + validate pair-forge
    runs-on: ubuntu-latest
    needs: pair-forge
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install agents
        run: uv pip install -e libs/atlas-core/ -e agents/pair-forge/ -e platform/agent-tester/

      - name: Smoke tests — agent-tester
        run: uv run pytest platform/agent-tester/agent_tester/tests/smoke/ -v

      - name: Validate pair-forge (level 1 — contract)
        run: uv run python -m agent_tester run --agent agents/pair-forge --level 1

      - name: Validate pair-forge (level 2 — prompt contracts)
        run: uv run python -m agent_tester run --agent agents/pair-forge --level 2

  # ── agent-forge ───────────────────────────────────────────────────────────
  agent-forge:
    name: agent-forge / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install agent-forge
        run: uv pip install -e libs/atlas-core/ -e agents/agent-forge/ -e platform/agent-tester/

      - name: Smoke tests — agent-forge
        run: uv run pytest agents/agent-forge/agent_forge/tests/smoke/ -v

  # ── atlas-bus ─────────────────────────────────────────────────────────────
  atlas-bus:
    name: atlas-bus / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install atlas-bus
        run: uv pip install -e libs/atlas-core/ -e "platform/atlas-bus/[dev]"

      - name: Smoke tests — atlas-bus
        run: uv run pytest platform/atlas-bus/atlas_bus/tests/smoke/ -v

  # ── cdc-router ────────────────────────────────────────────────────────────
  cdc-router:
    name: cdc-router / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install cdc-router
        run: uv pip install -e libs/atlas-core/ -e "agents/cdc-router/[dev]"

      - name: Dependency status
        run: uv run python -m cdc_router check
        continue-on-error: true

      - name: Smoke tests — cdc-router
        run: uv run pytest agents/cdc-router/cdc_router/tests/smoke/ -v

  # ── atlas-memory ──────────────────────────────────────────────────────────
  atlas-memory:
    name: atlas-memory / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install atlas-memory
        run: uv pip install -e libs/atlas-core/ -e "platform/atlas-memory/[dev]"

      - name: Dependency status
        run: uv run python -m atlas_memory check
        continue-on-error: true

      - name: Smoke tests — atlas-memory
        run: uv run pytest platform/atlas-memory/atlas_memory/tests/smoke/ -v

  # ── atlas-judge ───────────────────────────────────────────────────────────
  atlas-judge:
    name: atlas-judge / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install atlas-judge + cdc-router (for criteria.py)
        run: uv pip install -e libs/atlas-core/ -e "platform/atlas-judge/[dev]" -e "agents/cdc-router/"

      - name: Dependency status
        run: uv run python -m atlas_judge check
        continue-on-error: true

      - name: Smoke tests — atlas-judge
        run: uv run pytest platform/atlas-judge/atlas_judge/tests/smoke/ -v

  # ── atlas-orchestrator ────────────────────────────────────────────────────
  atlas-orchestrator:
    name: atlas-orchestrator / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install atlas-orchestrator + deps
        run: |
          uv pip install \
            -e libs/atlas-core/ \
            -e "platform/atlas-orchestrator/[dev]" \
            -e "agents/cdc-router/" \
            -e "platform/atlas-judge/" \
            -e "platform/atlas-bus/"

      - name: Dependency status
        run: uv run python -m atlas_orchestrator check
        continue-on-error: true

      - name: Smoke tests — atlas-orchestrator
        run: uv run pytest platform/atlas-orchestrator/atlas_orchestrator/tests/smoke/ -v

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install ruff
        run: uv pip install "ruff==0.7.4"

      - name: Ruff check
        run: uv run ruff check agents/ platform/ libs/

      - name: Ruff format check
        run: uv run ruff format --check agents/ platform/ libs/
