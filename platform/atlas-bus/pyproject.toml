[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bus"
version = "1.0.0"
description = "ATLAS agent bus: discovery, isolation, and pipeline routing for ATLAS agents."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atlas-bus = "atlas_bus.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_bus*"]

[tool.setuptools.package-data]
"atlas_bus.tests.smoke.fixtures" = ["*"]
