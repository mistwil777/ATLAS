[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-validator"
version = "1.0.0"
description = "ATLAS contract validator: structural contract, prompt contracts, and behavioral golden tests."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0,<5.0",
    "pytest>=8.0,<9.0",
]

[project.optional-dependencies]
golden = ["inspect-ai>=0.3,<1.0"]
dev    = ["pytest>=8.0"]

[project.scripts]
contract-validator = "contract_validator.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contract_validator*"]

[tool.setuptools.package-data]
"contract_validator.tests.smoke.fixtures" = ["**/*"]
